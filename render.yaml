services:
  - type: web
    name: plants-dashboard
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: UPLOADS_DIR
        value: /data/uploads
      - key: DATABASE_URL
        fromDatabase:
          name: plants-db
          property: connectionString
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: VISION_MODEL
        value: gemini-3.6-flash
    disk:
      name: uploads
      mountPath: /data/uploads
      sizeGB: 10

databases:
  - name: plants-db
    plan: basic-256mb
